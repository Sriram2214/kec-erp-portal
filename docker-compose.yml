version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kce-erp-db
    environment:
      POSTGRES_USER: kce_user
      POSTGRES_PASSWORD: kce_password
      POSTGRES_DB: kce_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  app:
    build: .
    container_name: kce-erp-app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://kce_user:kce_password@db:5432/kce_erp
      - SECRET_KEY=kce_production_secret_key_9112
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    ports:
      - "5000:5000"
    volumes:
      - erp_logs:/app/logs
    restart: always

volumes:
  erp_data:
  erp_logs:
